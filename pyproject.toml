[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guicang"
version = "0.3.5"
description = "归藏 —— 摄影师素材分类：区域/活动 → 年 → 备份周期 → 拍摄类型，抖音单独一枝，判定带证据，原件不动"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CodeVoyagerht" }]
keywords = ["photography", "footage", "dam", "exif", "drone", "classification"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Multimedia :: Graphics",
]
dependencies = []

[project.optional-dependencies]
# 图像 EXIF 走 Pillow 更全（含 PNG/HEIC 插件）；不装也能读 JPEG/TIFF
exif = ["pillow>=10"]
dev = ["pytest>=8"]

[project.scripts]
guicang = "guicang.cli:main"

[project.urls]
Homepage = "https://github.com/CodeVoyagerht/guicang"

[tool.setuptools.packages.find]
where = ["src"]

# 网页是单页三件套，必须跟着包装走，否则 pip 装完 serve 打不开
[tool.setuptools.package-data]
guicang = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
