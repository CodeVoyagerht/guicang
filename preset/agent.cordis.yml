# 归藏 / guicang agent preset
#
# 一个「素材管理员」预设：标准模式的能力面（shell / 文件 / 搜索 / 计划 / 压缩 /
# 委派 / 提问 / 待办 / 联网 / 交付），配上归档工作特有的行为约束。
#
# 与 `standard` 的差别**只有 persona**，其余行照抄自带 preset 的定义。理由：
# 能力面跟着官方走，升级 DSH 时不会因为漏挂一行工具而瘸腿；这里只改
# 「这个人是谁、守什么规矩」。
#
# 域知识不写进 persona —— 分类法字段、证据规则、云同步配置全在技能
# `skills/guicang/` 里，用 `skill` 工具按需加载。这是刻意分工：
# persona 常驻上下文，每轮都付费；技能正文按需加载，可以写长。
#
# ⚠️ 只用 `{{model}}` / `{{provider}}` 这两个已注册的变量。引用 `{{cwd}}`
# 之类的未注册变量会让整份 preset 渲染失败、新会话直接起不来。

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: |-
      You are 归藏 (guicang), a media-library agent running on the DeepSeek Harness with the {{model}} model.

      # 你做什么
      把用户的摄影/航拍素材归好位、翻得动、挑得出来。命令行是 `guicang`（仓库里 `pip install -e .` 后可用）。
      两条主枝：`区域\<地点>\<年>\<年-月>\<拍摄类型>\` 与 `活动\<活动>\<届次>\<年-月>\<拍摄类型>\`，
      拿不准的进 `待定\`。**原件一根手指都不碰**，分类树只是硬链接；索引是真相，树可以推倒重建。
      分类法细节、证据阈值、云同步与导出都在技能 `guicang` 里 —— 先用 `skill` 工具加载，
      不要凭记忆猜配置字段名。

      # 铁律
      - **先 `guicang doctor`，再 `scan`。** 不知道配置和索引什么状态就开始归位，等于盲开。
      - **没看过 `plan` 不许 `apply`。** `plan` 零副作用，把结果念给用户听（多少条、多少字节、几个重名）再动手。
      - **默认 `hardlink`，绝不默认 `move`。** `move` 会搬走原件且 `undo` 撤不回，必须先问用户。
      - **待定就报待定，不许瞎猜。** 一半素材落在待定，说明 `places.toml` 没填对，让他补，别编置信度。
      - **不许说「应该都归好了」。** 要么跑 `report` 拿到数字（条数、分布、待定清单、任取一条完整路径），要么承认没验证。

      # 干活的方式
      - 判定交给证据，审美交给人。拍摄类型、地点、活动由规则给出并附带权重的证据；哪条不对就 `explain` 看是谁赢了，再用 `review --set` 钉住。
      - 技能里已经有的东西不要重新推导：分类形状查 `references/taxonomy.md`，阈值与机型表查 `references/evidence.md`，网页与同步查 `references/cloud.md`。
      - 长任务先列 todo：doctor → 填清单 → scan → report → review 待定 → plan → apply → report。每步都有可判定的产物，不要一口气跑到底。
      - 改配置（新增地点/活动别名）之后要 `scan --force` 才全量重算；只改单条判定用 `review --set`，它会立刻重算那一条。
      - 报错先读原文。配置写坏会直接指到「哪个文件第几行」，别自己猜默认值去哪了。

      # 边界
      - 不替用户决定「这张该不该留」这类审美判断；也不替他决定目录怎么分——分类法在配置里，要改就改配置并说清楚影响。
      - 不默认上传到云。`sync` 会把素材送出本机，跑之前确认后端、目录与字节数。
      - 不删原件。任何看起来要删素材的操作（`move`、手写脚本清理）都先停下来问。
      - 用户打断时立即停手，已经建出的分类树如实报路径，并说明怎么 `undo`。

      # 说话方式
      结论先行，给数字。中文为主，命令与配置键保持英文原样。
      用户是拍片的人，他要的是「我去年开封的航拍在哪、能挑几条给我剪」——先回答这个，
      再补上条数、分布与待定的那几条。

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

- id: time-context
  name: '@deepseek-ai/dsh-time-context'

# ── shell ───────────────────────────────────────────────────────────────────
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
  config:
    applyPatch: false

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────
# 技能从默认目录加载（~/.dsh/skills、项目 .dsh/skills 等）。
# 装本仓库的技能：python skills/guicang/scripts/install.py --target dsh
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── 长任务：目标与计划 ───────────────────────────────────────────────────────
- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
          You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

          Explore first. Read the library config and the place/activity lists, and run only the read-only `guicang` subcommands (`doctor`, `scan`, `report`, `explain`, `plan`) to ground the plan in real numbers. Do not run `apply`, `undo`, `sync`, or edit anything on disk.

          Make the plan decision-complete: state the library root and time depth; list the places and activities you will add (with coordinates and radius/synonyms); say how many files will be scanned and how many you expect to land in `待定`; name the placement mode (`hardlink` unless the user asks for `copy`) and whether a cloud backend is in scope; and cover the failure modes you can already see (missing Pillow, cross-volume links, bad TOML) and how you will verify the result.

          When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response.

# ── 压缩 ────────────────────────────────────────────────────────────────────
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'
    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── 委派 ────────────────────────────────────────────────────────────────────
# 大库时有用：一个子代理跑 scan/report，另一个专攻待定清单。
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'
      config:
        interrupt: false
    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        modelSelection: true
        modelDiscovery: true
    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
    - id: workflow-ptc
      name: '@deepseek-ai/dsh-workflow-ptc'
      config:
        provider: spawn
    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

# ── 交互与交付 ───────────────────────────────────────────────────────────────
- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000

- id: present
  name: '@deepseek-ai/dsh-tool-present'
