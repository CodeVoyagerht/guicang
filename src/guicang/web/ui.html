<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="stylesheet" href="/ui.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">归藏</span>
    <span class="lib" id="library">…</span>
  </div>
  <div class="stats" id="stats"></div>
  <div class="actions">
    <button class="ghost" id="btn-refresh" title="重新读索引">刷新</button>
    <button class="ghost" id="btn-export" title="按当前筛选导出台账">导出台账</button>
  </div>
</header>

<main>
  <aside class="sidebar">
    <section>
      <h3>拍摄类型</h3>
      <div class="chips" id="facet-shot"></div>
    </section>
    <section>
      <h3>区域</h3>
      <select id="facet-region"><option value="">全部区域</option></select>
      <select id="facet-area" hidden><option value="">全部园区区域</option></select>
    </section>
    <section>
      <h3>活动</h3>
      <select id="facet-activity"><option value="">全部活动</option></select>
    </section>
    <section>
      <h3>时间</h3>
      <select id="facet-month"><option value="">全部时间</option></select>
    </section>
    <section>
      <h3>状态</h3>
      <select id="facet-status">
        <option value="">全部</option>
        <option value="auto">已自动归类</option>
        <option value="needs_review">待定</option>
      </select>
    </section>
    <section>
      <h3>搜索</h3>
      <input id="facet-query" placeholder="文件名 / 机型" autocomplete="off">
    </section>
    <section>
      <h3>选集</h3>
      <div id="collections" class="collections"></div>
    </section>
    <section class="hint">
      <p>点卡片看详情，勾左上角选素材。筛选与勾选都只读，不改原件。</p>
      <p id="sync-note" class="muted"></p>
    </section>
  </aside>

  <section class="content">
    <div class="content-head">
      <span id="result-count">…</span>
      <span class="muted" id="selection-note"></span>
    </div>
    <div class="grid" id="grid"></div>
    <div class="pager">
      <button class="ghost" id="btn-more">加载更多</button>
    </div>
  </section>
</main>

<footer class="selbar" id="selbar" hidden>
  <span id="sel-count">已选 0</span>
  <input id="sel-name" placeholder="选集名字，例如：开封菊花节-预告片">
  <button class="primary" id="btn-save">存为选集</button>
  <button class="ghost" id="btn-export-sel">导出 CSV / 清单</button>
  <button class="ghost" id="btn-clear">取消勾选</button>
</footer>

<div class="modal" id="modal" hidden>
  <div class="modal-body">
    <button class="close" id="modal-close">×</button>
    <div class="modal-media" id="modal-media"></div>
    <div class="modal-meta" id="modal-meta"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>
<script src="/ui.js"></script>
</body>
</html>
